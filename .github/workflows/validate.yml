name: Validate

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install "jsonschema>=4.21" "pytest>=8.0"

      - name: Validate every case against its schemas
        run: python3 scripts/validate_case.py --all --strict

      - name: Check every published case ran all required stages
        run: python3 scripts/check_pipeline.py --all

      - name: Run test suite
        run: python3 -m pytest -q
